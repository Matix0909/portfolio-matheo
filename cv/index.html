<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Mathéo Guéant</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="alternate icon" href="../assets/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0A0E14;
    --bg-soft: #0E141C;
    --panel: #121A23;
    --panel-hover: #16202B;
    --ink: #EEF2F6;
    --ink-dim: #93A2B4;
    --ink-faint: #5C6B7E;
    --signal: #5FD3A3;
    --signal-dim: rgba(95,211,163,0.12);
    --amber: #E0A649;
    --violet: #8B7FE8;
    --line: rgba(238,242,246,0.08);
    --line-strong: rgba(238,242,246,0.15);
    --shadow: rgba(0,0,0,0.35);
    --header-bg: rgba(14,20,28,0.55);
    --glow-a: rgba(95,211,163,0.16);
    --glow-b: rgba(139,127,232,0.13);
    --glow-c: rgba(224,166,73,0.07);
  }
  :root[data-theme="light"] {
    --bg: #F2F4F6;
    --bg-soft: #FFFFFF;
    --panel: #FFFFFF;
    --panel-hover: #F7F9FA;
    --ink: #15202B;
    --ink-dim: #576473;
    --ink-faint: #8996A5;
    --line: rgba(21,32,43,0.09);
    --line-strong: rgba(21,32,43,0.17);
    --shadow: rgba(21,32,43,0.08);
    --header-bg: rgba(242,244,246,0.75);
    --glow-a: rgba(95,211,163,0.22);
    --glow-b: rgba(139,127,232,0.17);
    --glow-c: rgba(224,166,73,0.09);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F4F6;
      --bg-soft: #FFFFFF;
      --panel: #FFFFFF;
      --panel-hover: #F7F9FA;
      --ink: #15202B;
      --ink-dim: #576473;
      --ink-faint: #8996A5;
      --line: rgba(21,32,43,0.09);
      --line-strong: rgba(21,32,43,0.17);
      --shadow: rgba(21,32,43,0.08);
      --header-bg: rgba(242,244,246,0.75);
      --glow-a: rgba(95,211,163,0.22);
      --glow-b: rgba(139,127,232,0.17);
      --glow-c: rgba(224,166,73,0.09);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }

  .bg-glow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(640px 480px at 12% 3%, var(--glow-a), transparent 65%),
      radial-gradient(700px 520px at 90% 6%, var(--glow-b), transparent 65%),
      radial-gradient(780px 520px at 50% 30%, var(--glow-c), transparent 70%),
      radial-gradient(620px 520px at 6% 28%, var(--glow-b), transparent 65%),
      radial-gradient(680px 540px at 94% 46%, var(--glow-a), transparent 65%),
      radial-gradient(640px 520px at 10% 66%, var(--glow-c), transparent 65%),
      radial-gradient(700px 560px at 90% 82%, var(--glow-b), transparent 65%),
      radial-gradient(760px 520px at 50% 98%, var(--glow-a), transparent 65%);
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px),
      linear-gradient(var(--line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-strong) 1px, transparent 1px);
    background-size: 42px 42px, 42px 42px, 210px 210px, 210px 210px;
    background-position:
      0 calc(var(--sy, 0) * -0.08px), 0 calc(var(--sy, 0) * -0.08px),
      0 calc(var(--sy, 0) * -0.2px), 0 calc(var(--sy, 0) * -0.2px);
    -webkit-mask-image: radial-gradient(ellipse 95% 85% at 50% 45%, #000 0%, transparent 100%);
            mask-image: radial-gradient(ellipse 95% 85% at 50% 45%, #000 0%, transparent 100%);
    opacity: 0.55;
  }

  #netbg {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.65;
    background: radial-gradient(ellipse 130% 110% at 50% 50%, transparent 58%, var(--bg) 100%);
  }

  header {
    position: sticky;
    top: 14px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 12px 14px 12px 22px;
    background: var(--header-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    box-shadow:
      0 10px 30px -12px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.04);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px var(--signal); animation: pulse 2.4s ease-in-out infinite; }
  .brand span { font-family: 'IBM Plex Mono', monospace; font-size: 0.94rem; letter-spacing: 0.02em; }
  nav { display: flex; align-items: center; gap: 2px; }
  nav a {
    text-decoration: none;
    padding: 8px 14px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    border-radius: 100px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  nav a:hover { color: var(--ink); background: var(--panel); }

  .docs-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .doc-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 100px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    text-decoration: none;
    border: 1px solid transparent;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .doc-pill svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.85; }
  .doc-pill:hover {
    color: var(--signal);
    background: var(--signal-dim);
    border-color: rgba(95,211,163,0.28);
    transform: translateY(-1px);
  }
  .doc-pill:hover svg { opacity: 1; }
  .doc-pill-live { color: var(--signal); }
  .doc-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 9px;
    font-size: 0.9rem;
    text-decoration: none;
    font-weight: 500;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--signal); color: #0A0E14; box-shadow: 0 4px 18px -6px rgba(95,211,163,0.5); }
  .btn-primary:hover { transform: translateY(-1px); background: #74dbb0; box-shadow: 0 6px 22px -6px rgba(95,211,163,0.6); }
  .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--signal); color: var(--signal); }

  section { padding: 76px 0; border-top: 1px solid var(--line); }

  .timeline { position: relative; padding-left: 30px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
  .tl-item { position: relative; padding-bottom: 32px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: -30px;
    top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--signal);
    box-shadow: 0 0 0 4px var(--signal-dim);
  }
  .tl-item .period { font-family: 'IBM Plex Mono', monospace; color: var(--signal); font-size: 0.79rem; margin-bottom: 7px; display: block; }
  .tl-item h4 { font-size: 1.02rem; font-weight: 600; margin-bottom: 2px; }
  .tl-item .place { color: var(--ink-faint); font-size: 0.82rem; margin-bottom: 12px; }
  .tl-item ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .tl-item ul li { color: var(--ink-dim); font-size: 0.87rem; padding-left: 16px; position: relative; }
  .tl-item ul li::before { content: "—"; position: absolute; left: 0; color: var(--ink-faint); }

  footer { padding: 32px 0 54px; display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; }

  .cv-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px;
    box-shadow: 0 12px 30px -14px var(--shadow);
  }
  .cv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
  .cv-top h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  .cv-role { color: var(--signal); font-size: 0.85rem; font-family: 'IBM Plex Mono', monospace; }
  .cv-top .btn { white-space: nowrap; }
  .cv-profile { color: var(--ink-dim); font-size: 0.92rem; max-width: 62ch; margin-bottom: 36px; }
  .cv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 40px; }
  .cv-col h4 { font-size: 0.76rem; color: var(--ink-faint); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; }
  .cv-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .cv-list li { font-size: 0.87rem; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
  .cv-list .cv-period { color: var(--signal); font-size: 0.75rem; }
  .cv-list.plain li { color: var(--ink-dim); }
  .cv-tags { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .cv-tags li { font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); background: var(--bg-soft); border: 1px solid var(--line); padding: 6px 11px; border-radius: 100px; }
  .cv-section-title { font-size: 0.76rem; color: var(--ink-faint); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 22px; }

  .cv-photo {
    width: 86px;
    height: 86px;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid var(--line-strong);
    box-shadow: 0 8px 20px -10px var(--shadow);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .cv-photo:hover { transform: translateY(-2px); border-color: var(--signal); }
  .cv-top-id { display: flex; align-items: center; gap: 18px; }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(5,7,11,0.86);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: min(420px, 90vw);
    max-height: 80vh;
    border-radius: 18px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
  }

  @media print {
    header, #netbg, .bg-glow, .bg-grid, .bg-vignette, footer, .cv-top .btn { display: none !important; }
    body { background: #fff; color: #111; }
    .cv-card { box-shadow: none; border: none; padding: 0; }
    section { padding: 0; border-top: none; }
    .subpage-hero { display: none; }
  }

  @media (max-width: 760px) {
    nav a { padding: 8px 10px; }
    header { flex-wrap: wrap; gap: 10px; }
    nav { order: 3; width: 100%; justify-content: center; }
    .docs-group { margin-left: auto; }
    .doc-pill span { display: none; }
    .doc-pill { padding: 8px; }
    .doc-pill svg, .doc-pill-dot { margin: 0; }
    footer { flex-direction: column; gap: 8px; }
    .cv-grid { grid-template-columns: 1fr; gap: 24px; }
    .cv-top { flex-direction: column; align-items: stretch; }
    .cv-top .btn { width: 100%; justify-content: center; }
  }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
    #netbg { display: none; }
  }

  .subpage-hero { padding: 120px 0 20px; }
  .breadcrumb { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 22px; }
  .breadcrumb a { color: var(--ink-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--signal); }
  .subpage-hero h1 { font-size: clamp(2rem, 4.4vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
  .subpage-hero p { color: var(--ink-dim); max-width: 56ch; font-size: 1rem; }
</style>
</head>

<script>
(function () {
  var canvas = document.getElementById('netbg');
  if (!canvas) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var ctx = canvas.getContext('2d');
  var root = document.documentElement;
  var lightMQ = window.matchMedia('(prefers-color-scheme: light)');
  var TAU = Math.PI * 2;
  var w, h, dpr;
  var sy = window.pageYOffset || 0;
  var mx = 0, my = 0, tmx = 0, tmy = 0, last = 0;
  var layers = [];

  var COLORS = {
    signal: '95,211,163',
    amber: '224,166,73',
    violet: '139,127,232',
    inkD: '238,242,246',
    inkL: '21,32,43'
  };

  var LAYERS = [
    { cell: 84,  par: 0.05, drift: 3,  line: 0.05, lw: 0.6, nr: 0.9, na: 0.22, halo: 0,  ha: 0,    hs: 9,  tail: 14, sp: 0.5, keep: 0.55, pf: 0.05, on: 0.5 },
    { cell: 130, par: 0.16, drift: 6,  line: 0.09, lw: 1,   nr: 1.8, na: 0.34, halo: 16, ha: 0.30, hs: 17, tail: 32, sp: 0.9, keep: 0.50, pf: 0.07, on: 0.5 },
    { cell: 230, par: 0.42, drift: 11, line: 0.13, lw: 1.8, nr: 3.4, na: 0.48, halo: 40, ha: 0.55, hs: 36, tail: 76, sp: 1.5, keep: 0.42, pf: 0.10, on: 0.6 },
    { cell: 380, par: 0.80, drift: 16, line: 0,    lw: 0,   nr: 0,   na: 0,    halo: 90, ha: 0.16, hs: 0,  tail: 0,  sp: 0,   keep: 0,    pf: 0,    on: 0.45 }
  ];

  var sprites = {};
  Object.keys(COLORS).forEach(function (k) { sprites[k] = makeSprite(COLORS[k]); });

  function makeSprite(rgb) {
    var s = document.createElement('canvas');
    s.width = s.height = 64;
    var g = s.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.18, 'rgba(' + rgb + ',0.55)');
    grad.addColorStop(0.5, 'rgba(' + rgb + ',0.14)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return s;
  }

  function pickHue() {
    var r = Math.random();
    return r < 0.5 ? 'signal' : (r < 0.78 ? 'violet' : 'amber');
  }
  function pulseHue() {
    var r = Math.random();
    return r < 0.72 ? 'signal' : (r < 0.86 ? 'amber' : 'violet');
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function addEdge(L, a, b) {
    var A = L.nodes[a], B = L.nodes[b];
    var dx = B.x - A.x, dy = B.y - A.y;
    if (dy < -L.tileH / 2) dy += L.tileH;
    L.edges.push({ a: a, b: b, len: Math.sqrt(dx * dx + dy * dy) || 1, ax: 0, ay: 0, bx: 0, by: 0 });
  }

  function spawn(L, startRandom) {
    L.pulses.push({
      e: L.edges[(Math.random() * L.edges.length) | 0],
      t: startRandom ? Math.random() : 0,
      v: (0.4 + Math.random() * 0.5) * L.sp,
      hue: pulseHue()
    });
  }

  function build() {
    var k = w < 760 ? 0.72 : 1;
    layers = LAYERS.map(function (cfg) {
      var L = {}, key;
      for (key in cfg) L[key] = cfg[key];
      L.cell = cfg.cell * k;
      L.halo = cfg.halo * k;
      var cols = Math.ceil(w / L.cell) + 3;
      var rows = Math.ceil((h + 2 * L.cell) / L.cell) + 1;
      L.tileH = rows * L.cell;
      L.nodes = [];
      L.edges = [];
      L.pulses = [];

      var grid = [], jit = L.cell * 0.32, gx, gy;
      for (gy = 0; gy < rows; gy++) {
        grid[gy] = [];
        for (gx = 0; gx < cols; gx++) {
          grid[gy][gx] = L.nodes.length;
          L.nodes.push({
            x: (gx - 1) * L.cell + (Math.random() - 0.5) * jit,
            y: gy * L.cell + (Math.random() - 0.5) * jit,
            on: Math.random() < L.on,
            ph: Math.random() * TAU,
            tw: 0.5 + Math.random() * 1.3,
            hue: pickHue()
          });
        }
      }

      if (L.keep) {
        for (gy = 0; gy < rows; gy++) {
          for (gx = 0; gx < cols; gx++) {
            var a = grid[gy][gx];
            if (gx < cols - 1 && Math.random() < L.keep) addEdge(L, a, grid[gy][gx + 1]);
            if (Math.random() < L.keep) addEdge(L, a, grid[(gy + 1) % rows][gx]);
          }
        }
      }

      L.pos = new Float32Array(L.nodes.length * 2);
      if (L.pf && L.edges.length) {
        var count = Math.max(5, Math.round(L.edges.length * L.pf));
        for (var i = 0; i < count; i++) spawn(L, true);
      }
      return L;
    });
  }

  function draw(now, dt) {
    var theme = root.getAttribute('data-theme');
    var light = theme === 'light' || (theme !== 'dark' && lightMQ.matches);
    var ink = light ? COLORS.inkL : COLORS.inkD;

    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';

    for (var li = 0; li < layers.length; li++) {
      var L = layers[li], nodes = L.nodes, edges = L.edges, P = L.pos;
      var i, e, n, ax, ay, bx, by;
      var off = sy * L.par + now * 0.001 * L.drift;
      var ox = mx * L.par * 60, oy = my * L.par * 40;
      var half = L.tileH / 2;

      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        P[2 * i] = n.x + ox;
        P[2 * i + 1] = (((n.y - off) % L.tileH) + L.tileH) % L.tileH - L.cell + oy;
      }

      if (L.line) {
        ctx.lineWidth = L.lw;
        ctx.strokeStyle = 'rgba(' + ink + ',' + L.line + ')';
        ctx.beginPath();
        for (i = 0; i < edges.length; i++) {
          e = edges[i];
          ax = P[2 * e.a]; ay = P[2 * e.a + 1];
          bx = P[2 * e.b]; by = P[2 * e.b + 1];
          if (by - ay > half) by -= L.tileH;
          else if (by - ay < -half) by += L.tileH;
          e.ax = ax; e.ay = ay; e.bx = bx; e.by = by;
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
        }
        ctx.stroke();
      }

      var pad = L.halo + 8;
      for (i = 0; i < nodes.length; i++) {
        n = nodes[i];
        if (!n.on) continue;
        var x = P[2 * i], y = P[2 * i + 1];
        if (x < -pad || x > w + pad || y < -pad || y > h + pad) continue;
        var tw = 0.65 + 0.35 * Math.sin(now * 0.001 * n.tw + n.ph);
        if (L.halo) {
          ctx.globalAlpha = L.ha * tw;
          ctx.drawImage(sprites[n.hue], x - L.halo, y - L.halo, L.halo * 2, L.halo * 2);
        }
        if (L.nr) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = 'rgba(' + ink + ',' + (L.na * tw).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(x, y, L.nr, 0, TAU);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      for (i = L.pulses.length - 1; i >= 0; i--) {
        var p = L.pulses[i];
        e = p.e;
        p.t += p.v * dt / e.len;
        if (p.t >= 1) { L.pulses.splice(i, 1); spawn(L, false); continue; }
        var fade = Math.sin(p.t * Math.PI);
        var px = e.ax + (e.bx - e.ax) * p.t;
        var py = e.ay + (e.by - e.ay) * p.t;
        var tt = Math.max(0, p.t - L.tail / e.len);
        var tx = e.ax + (e.bx - e.ax) * tt;
        var ty = e.ay + (e.by - e.ay) * tt;

        ctx.strokeStyle = 'rgba(' + COLORS[p.hue] + ',' + (0.4 * fade).toFixed(3) + ')';
        ctx.lineWidth = L.lw + 0.8;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(px, py);
        ctx.stroke();

        ctx.globalAlpha = 0.2 + 0.8 * fade;
        ctx.drawImage(sprites[p.hue], px - L.hs, py - L.hs, L.hs * 2, L.hs * 2);
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    var dt = last ? Math.min(3, (now - last) / 16.667) : 1;
    last = now;
    mx += (tmx - mx) * 0.05 * dt;
    my += (tmy - my) * 0.05 * dt;
    draw(now, dt);
    requestAnimationFrame(frame);
  }

  window.addEventListener('scroll', function () {
    sy = window.pageYOffset || 0;
    root.style.setProperty('--sy', sy);
  }, { passive: true });

  window.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    tmx = (ev.clientX / w - 0.5) * 2;
    tmy = (ev.clientY / h - 0.5) * 2;
  }, { passive: true });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      build();
    }, 200);
  });

  root.style.setProperty('--sy', sy);
  resize();
  build();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
