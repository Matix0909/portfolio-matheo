<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Mathéo Guéant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0A0E14;
    --bg-soft: #0E141C;
    --panel: #121A23;
    --panel-hover: #16202B;
    --ink: #EEF2F6;
    --ink-dim: #93A2B4;
    --ink-faint: #5C6B7E;
    --signal: #5FD3A3;
    --signal-dim: rgba(95,211,163,0.12);
    --amber: #E0A649;
    --violet: #8B7FE8;
    --line: rgba(238,242,246,0.08);
    --line-strong: rgba(238,242,246,0.15);
    --shadow: rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --bg: #F2F4F6;
    --bg-soft: #FFFFFF;
    --panel: #FFFFFF;
    --panel-hover: #F7F9FA;
    --ink: #15202B;
    --ink-dim: #576473;
    --ink-faint: #8996A5;
    --line: rgba(21,32,43,0.09);
    --line-strong: rgba(21,32,43,0.17);
    --shadow: rgba(21,32,43,0.08);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F4F6;
      --bg-soft: #FFFFFF;
      --panel: #FFFFFF;
      --panel-hover: #F7F9FA;
      --ink: #15202B;
      --ink-dim: #576473;
      --ink-faint: #8996A5;
      --line: rgba(21,32,43,0.09);
      --line-strong: rgba(21,32,43,0.17);
      --shadow: rgba(21,32,43,0.08);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }

  /* ---- Background layers ---- */
  #netbg {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    opacity: 0.6;
    pointer-events: none;
  }
  :root[data-theme="light"] #netbg { opacity: 0.4; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) #netbg { opacity: 0.4; }
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 0%, transparent 72%);
    opacity: 0.7;
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(560px 420px at 14% 8%, rgba(95,211,163,0.16), transparent 65%),
      radial-gradient(620px 460px at 88% 2%, rgba(139,127,232,0.13), transparent 65%),
      radial-gradient(700px 500px at 50% 30%, rgba(224,166,73,0.06), transparent 70%);
    filter: blur(6px);
  }
  :root[data-theme="light"] .bg-glow {
    background:
      radial-gradient(560px 420px at 14% 8%, rgba(95,211,163,0.20), transparent 65%),
      radial-gradient(620px 460px at 88% 2%, rgba(139,127,232,0.16), transparent 65%),
      radial-gradient(700px 500px at 50% 30%, rgba(224,166,73,0.08), transparent 70%);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .bg-glow {
      background:
        radial-gradient(560px 420px at 14% 8%, rgba(95,211,163,0.20), transparent 65%),
        radial-gradient(620px 460px at 88% 2%, rgba(139,127,232,0.16), transparent 65%),
        radial-gradient(700px 500px at 50% 30%, rgba(224,166,73,0.08), transparent 70%);
    }
  }

  .bg-fade {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, transparent 0%, var(--bg) 80%),
      linear-gradient(180deg, transparent 0%, var(--bg) 94%);
  }
  /* ---- end background layers ---- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    background: rgba(10,14,20,0.68);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  :root[data-theme="light"] header { background: rgba(242,244,246,0.75); }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) header { background: rgba(242,244,246,0.75); }
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px var(--signal); animation: pulse 2.4s ease-in-out infinite; }
  .brand span { font-family: 'IBM Plex Mono', monospace; font-size: 0.94rem; letter-spacing: 0.02em; }
  nav { display: flex; align-items: center; gap: 2px; }
  nav a {
    text-decoration: none;
    padding: 8px 14px;
    font-size: 0.85rem;
    color: var(--ink-dim);
    border-radius: 7px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  nav a:hover { color: var(--ink); background: var(--panel); }

  .docs-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .doc-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 100px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    text-decoration: none;
    border: 1px solid transparent;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .doc-pill svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.85; }
  .doc-pill:hover {
    color: var(--signal);
    background: var(--signal-dim);
    border-color: rgba(95,211,163,0.28);
    transform: translateY(-1px);
  }
  .doc-pill:hover svg { opacity: 1; }
  .doc-pill-live { color: var(--signal); }
  .doc-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hero { padding: 132px 0 100px; max-width: 700px; }
  .hero .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--signal);
    font-size: 0.84rem;
    margin-bottom: 26px;
    padding: 7px 14px;
    background: var(--signal-dim);
    border-radius: 100px;
    border: 1px solid rgba(95,211,163,0.22);
  }
  .hero .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
  .hero h1 {
    font-size: clamp(2.6rem, 6vw, 4rem);
    font-weight: 700;
    line-height: 1.05;
    margin-bottom: 22px;
    letter-spacing: -0.025em;
  }
  .hero p { color: var(--ink-dim); max-width: 48ch; font-size: 1.08rem; margin-bottom: 34px; }
  .hero-cta { display: flex; gap: 12px; margin-bottom: 56px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 9px;
    font-size: 0.9rem;
    text-decoration: none;
    font-weight: 500;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: var(--signal); color: #0A0E14; box-shadow: 0 4px 18px -6px rgba(95,211,163,0.5); }
  .btn-primary:hover { transform: translateY(-1px); background: #74dbb0; box-shadow: 0 6px 22px -6px rgba(95,211,163,0.6); }
  .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--signal); color: var(--signal); }

  .hero-stats { display: flex; gap: 36px; padding-top: 32px; border-top: 1px solid var(--line); }
  .hero-stats div { display: flex; flex-direction: column; gap: 4px; }
  .hero-stats .num { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; font-weight: 500; color: var(--signal); }
  .hero-stats .lbl { font-size: 0.8rem; color: var(--ink-faint); }

  section { padding: 76px 0; border-top: 1px solid var(--line); }
  .section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 40px; }
  .section-head .idx { font-family: 'IBM Plex Mono', monospace; color: var(--signal); font-size: 0.86rem; }
  .section-head h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.015em; }

  .skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .skill {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 20px;
    box-shadow: 0 8px 20px -12px var(--shadow);
    transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
  }
  .skill:hover { border-color: var(--line-strong); background: var(--panel-hover); transform: translateY(-3px); }
  .skill h3 { font-size: 0.96rem; font-weight: 600; margin-bottom: 16px; }
  .skill ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
  .skill li { font-size: 0.84rem; color: var(--ink-dim); }
  .skill li .bar { display: block; height: 3px; background: var(--line); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .skill li .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--signal), #8de8c8); border-radius: 3px; }

  .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .project {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 26px;
    background: var(--panel);
    box-shadow: 0 8px 20px -12px var(--shadow);
    transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
  }
  .project:hover { border-color: rgba(95,211,163,0.32); background: var(--panel-hover); transform: translateY(-4px); }
  .project .stack { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--amber); margin-bottom: 16px; letter-spacing: 0.02em; }
  .project h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; line-height: 1.35; }
  .project p { font-size: 0.87rem; color: var(--ink-dim); }

  .timeline { position: relative; padding-left: 30px; }
  .timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
  .tl-item { position: relative; padding-bottom: 36px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: -30px;
    top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--signal);
    box-shadow: 0 0 0 4px var(--signal-dim);
  }
  .tl-item .period { font-family: 'IBM Plex Mono', monospace; color: var(--signal); font-size: 0.79rem; margin-bottom: 7px; display: block; }
  .tl-item h3 { font-size: 1.06rem; font-weight: 600; margin-bottom: 7px; }
  .tl-item p { color: var(--ink-dim); font-size: 0.92rem; }

  .contact-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 28px;
    box-shadow: 0 12px 30px -14px var(--shadow);
  }
  .contact-panel h3 { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
  .contact-panel p { color: var(--ink-dim); font-size: 0.92rem; }
  .contact-links { display: flex; flex-direction: column; gap: 11px; align-items: flex-end; }
  .contact-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    color: var(--ink-dim);
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .contact-links a:hover { color: var(--signal); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 0.79rem; color: var(--signal); margin-bottom: 16px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 8px var(--signal); }

  footer { padding: 32px 0 54px; display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 0.8rem; font-family: 'IBM Plex Mono', monospace; }

  /* ---- CV ---- */
  .cv-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 36px;
    box-shadow: 0 12px 30px -14px var(--shadow);
  }
  .cv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .cv-top h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
  .cv-role { color: var(--signal); font-size: 0.85rem; }
  .cv-top .btn { white-space: nowrap; }
  .cv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .cv-col h4 { font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 14px; }
  .cv-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .cv-list li { font-size: 0.88rem; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
  .cv-list .cv-period { color: var(--signal); font-size: 0.75rem; }
  .cv-list.plain li { color: var(--ink-dim); }
  .cv-tags { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .cv-tags li { font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); background: var(--bg-soft); border: 1px solid var(--line); padding: 6px 11px; border-radius: 100px; }

  /* ---- Lettre de motivation ---- */
  .letter-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px;
    max-width: 720px;
    margin: 0 auto;
    box-shadow: 0 12px 30px -14px var(--shadow);
  }
  .letter-meta { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px dashed var(--line-strong); }
  .letter-body p { color: var(--ink-dim); font-size: 0.94rem; margin-bottom: 16px; }
  .letter-body .letter-sign { color: var(--ink); font-weight: 600; margin-top: 20px; margin-bottom: 0; }
  .letter-print { margin-top: 10px; }

  /* ---- Stage ---- */
  .stage-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 12px 30px -14px var(--shadow);
  }
  .stage-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; max-width: 44ch; }
  .stage-card > p { color: var(--ink-dim); font-size: 0.94rem; max-width: 56ch; margin-bottom: 28px; }
  .stage-facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
  .stage-fact { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .stage-fact .lbl { font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.03em; text-transform: uppercase; }
  .stage-fact .val { font-size: 0.88rem; color: var(--ink); }

  @media print {
    header, .hero-cta, #netbg, .bg-glow, .bg-grid, .bg-fade, footer, #stage, #contact,
    section:not(#cv):not(#lettre) { display: none !important; }
    body { background: #fff; color: #111; }
    .cv-card, .letter-card { box-shadow: none; border: none; }
  }

  @media (max-width: 760px) {
    .hero { padding: 84px 0 64px; }
    .hero-stats { gap: 24px; flex-wrap: wrap; }
    .skills { grid-template-columns: 1fr 1fr; }
    .projects { grid-template-columns: 1fr; }
    nav a { padding: 8px 10px; }
    header { flex-wrap: wrap; gap: 10px; }
    nav { order: 3; width: 100%; justify-content: center; }
    .docs-group { margin-left: auto; }
    .doc-pill span { display: none; }
    .doc-pill { padding: 8px; }
    .doc-pill svg, .doc-pill-dot { margin: 0; }
    .contact-panel { flex-direction: column; align-items: flex-start; text-align: left; }
    .contact-links { align-items: flex-start; }
    footer { flex-direction: column; gap: 8px; }
    .cv-grid { grid-template-columns: 1fr; gap: 24px; }
    .cv-top { flex-direction: column; align-items: stretch; }
    .cv-top .btn { width: 100%; justify-content: center; }
    .letter-card { padding: 28px; }
    .stage-facts { grid-template-columns: 1fr 1fr; }
  }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
    #netbg { display: none; }
  }

  /* ---- Page interne (CV / Lettre / Stage) ---- */
  .subpage-hero { padding: 120px 0 20px; }
  .breadcrumb { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 22px; }
  .breadcrumb a { color: var(--ink-dim); text-decoration: none; }
  .breadcrumb a:hover { color: var(--signal); }
  .subpage-hero h1 { font-size: clamp(2rem, 4.4vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
  .subpage-hero p { color: var(--ink-dim); max-width: 56ch; font-size: 1rem; }
  .empty-frame {
    background: var(--panel);
    border: 1px dashed var(--line-strong);
    border-radius: 16px;
    min-height: 440px;
    margin: 40px 0 90px;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>
<canvas id="netbg"></canvas>
<div class="bg-fade"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <a href="../index.html" style="text-decoration:none;color:inherit;"><span class="mono">matheo.gueant</span></a>
    </div>
    <nav>
      <a href="../index.html#competences">Compétences</a>
      <a href="../index.html#projets">Projets</a>
      <a href="../index.html#formation">Formation</a>
      <a href="../index.html#contact">Contact</a>
    </nav>

    <div class="docs-group">
      <a href="../cv/" class="doc-pill doc-pill-live" title="CV">
        <span class="doc-pill-dot"></span>
        <span>CV</span>
      </a>
      <a href="../lettredemotivation/" class="doc-pill" title="Lettre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 9.4 6.2a1.6 1.6 0 0 0 1.9 0L22.6 7" transform="translate(-0.6 0)"/></svg>
        <span>Lettre</span>
      </a>
      <a href="../stage/" class="doc-pill" title="Stage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Stage</span>
      </a>
    </div>
  </header>

  <section class="subpage-hero" style="border-top:none;">
    <div class="breadcrumb"><a href="../index.html">Accueil</a> / CV</div>
    <h1>CV</h1>
    <p>Curriculum vitae — BTS SIO option SISR.</p>
  </section>

  <div class="empty-frame"></div>

  <footer>
    <span class="mono">Mathéo Guéant — BTS SIO SISR</span>
    <span class="mono">2026</span>
  </footer>
</div>

<script>
(function () {
  var canvas = document.getElementById('netbg');
  if (!canvas) return;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var ctx = canvas.getContext('2d');
  var w, h, dpr;
  var CELL = 96;
  var cols, rows;
  var nodePts = [];
  var edges = [];
  var pulses = [];

  function isLight() {
    var theme = document.documentElement.getAttribute('data-theme');
    if (theme === 'light') return true;
    if (theme === 'dark') return false;
    return window.matchMedia('(prefers-color-scheme: light)').matches;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function colorFor(hue, alpha) {
    if (hue === 'amber') return 'rgba(224,166,73,' + alpha + ')';
    if (hue === 'violet') return 'rgba(139,127,232,' + alpha + ')';
    return 'rgba(95,211,163,' + alpha + ')';
  }

  function buildGrid() {
    cols = Math.ceil(w / CELL) + 2;
    rows = Math.ceil((h * 0.85) / CELL) + 2;
    nodePts = [];
    var grid = [];
    for (var gy = 0; gy < rows; gy++) {
      grid[gy] = [];
      for (var gx = 0; gx < cols; gx++) {
        var jitter = CELL * 0.28;
        var x = gx * CELL + (Math.random() - 0.5) * jitter;
        var y = gy * CELL + (Math.random() - 0.5) * jitter;
        var idx = nodePts.length;
        nodePts.push({ x: x, y: y, active: Math.random() < 0.5 });
        grid[gy][gx] = idx;
      }
    }

    edges = [];
    var keepChance = 0.55;
    for (var gy = 0; gy < rows; gy++) {
      for (var gx = 0; gx < cols; gx++) {
        var a = grid[gy][gx];
        if (gx < cols - 1 && Math.random() < keepChance) edges.push({ a: a, b: grid[gy][gx + 1] });
        if (gy < rows - 1 && Math.random() < keepChance) edges.push({ a: a, b: grid[gy + 1][gx] });
      }
    }

    pulses = [];
    var PULSE_COUNT = Math.max(10, Math.round(edges.length * 0.06));
    for (var i = 0; i < PULSE_COUNT; i++) spawnPulse();
  }

  function spawnPulse() {
    if (!edges.length) return;
    var e = edges[Math.floor(Math.random() * edges.length)];
    var hue = Math.random() < 0.78 ? 'signal' : (Math.random() < 0.5 ? 'amber' : 'violet');
    pulses.push({ edge: e, t: 0, speed: 0.004 + Math.random() * 0.006, hue: hue });
  }

  function step() {
    var light = isLight();
    var lineColor = light ? 'rgba(21,32,43,' : 'rgba(238,242,246,';
    var nodeColor = light ? 'rgba(21,32,43,' : 'rgba(238,242,246,';

    ctx.clearRect(0, 0, w, h);

    ctx.lineWidth = 1;
    for (var i = 0; i < edges.length; i++) {
      var e = edges[i];
      var a = nodePts[e.a], b = nodePts[e.b];
      ctx.strokeStyle = lineColor + '0.07)';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    for (var i = 0; i < nodePts.length; i++) {
      var n = nodePts[i];
      if (!n.active) continue;
      ctx.beginPath();
      ctx.arc(n.x, n.y, 1.3, 0, Math.PI * 2);
      ctx.fillStyle = nodeColor + '0.22)';
      ctx.fill();
    }

    for (var i = pulses.length - 1; i >= 0; i--) {
      var p = pulses[i];
      p.t += p.speed;
      if (p.t >= 1) { pulses.splice(i, 1); spawnPulse(); continue; }
      var a = nodePts[p.edge.a], b = nodePts[p.edge.b];
      var px = a.x + (b.x - a.x) * p.t;
      var py = a.y + (b.y - a.y) * p.t;
      var fade = Math.sin(p.t * Math.PI);

      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = colorFor(p.hue, 0.9 * fade + 0.1);
      ctx.shadowColor = colorFor(p.hue, 0.9);
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      var tailT = Math.max(0, p.t - 0.12);
      var tx = a.x + (b.x - a.x) * tailT;
      var ty = a.y + (b.y - a.y) * tailT;
      ctx.strokeStyle = colorFor(p.hue, 0.35 * fade);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(px, py);
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  resize();
  buildGrid();
  requestAnimationFrame(step);

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
      buildGrid();
    }, 200);
  });
})();
</script>

</body>
</html>
